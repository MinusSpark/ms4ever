<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Nuestro Calendario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light" style="padding-top: 90px;">

  <!-- Navbar fija -->
  <nav class="navbar fixed-top shadow-sm" style="background-color: #d63384;">
    <div class="container-fluid justify-content-center">
      <span class="fs-4 navbar-brand text-white fw-bold mx-3 m-0">Inicio Sesión para nuestro Calendario ❤️</span>
    </div>
  </nav>

  <!-- Carrusel centrado y estilizado -->
  <div class="container d-flex justify-content-center mt-3">
    <div style="max-width: 420px; width: 100%;">
      <div id="carouselExample" class="carousel slide shadow rounded overflow-hidden" data-bs-ride="carousel" data-bs-interval="2500">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="../Fotos/con mi sudadera.jpeg" class="d-block w-100" alt="foto 1">
          </div>
          <div class="carousel-item">
            <img src="../Fotos/juntos.jpeg" class="d-block w-100" alt="foto 2">
          </div>
          <div class="carousel-item">
            <img src="../Fotos/fotico gafas.jpeg" class="d-block w-100" alt="foto 3">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Sección de acceso en tarjeta -->
  <div class="container d-flex justify-content-center mt-4 mb-5">
    <div class="card shadow border-0 p-3 text-center" style="max-width: 450px; width: 100%;">
      <div class="card-body">
        <h3 class="text-danger fs-5 fw-bold mb-3">¡Identifícate! 🫵🏽</h3>

        <!-- Usuario -->
        <input type="text" id="nombreUsuario" class="form-control w-100 mx-auto mt-2 text-center"
               placeholder="Tu nombre de usuario amor" autocomplete="username" />

        <!-- Contraseña -->
        <input type="password" id="passwordInput" class="form-control w-100 mx-auto mt-3 text-center"
               placeholder="Responde mi amor" autocomplete="current-password" />

        <button id="btnAcceder" class="btn w-100 mt-4 text-white fw-bold py-2" style="background-color: #d63384; border: none;">Acceder</button>

        <p id="mensajeError" class="text-danger mt-3 mb-0" style="display:none; font-size: 0.9rem;">
          ❌ Usuario o contraseña incorrectos. ¡Inténtalo de nuevo!
        </p>
      </div>
    </div>
  </div>

  <script>
    // Valores esperados
    const EXPECTED_USER = "_sofiasanz_";
    const EXPECTED_PASS = "alex";

    function validarAcceso() {
      const nombre = (document.getElementById("nombreUsuario").value || "").trim().toLowerCase();
      const contrasena = (document.getElementById("passwordInput").value || "").trim().toLowerCase();

      const okUser = nombre === EXPECTED_USER;
      const okPass = contrasena === EXPECTED_PASS;

      const inputUser = document.getElementById("nombreUsuario");
      const inputPass = document.getElementById("passwordInput");
      const msg = document.getElementById("mensajeError");

      if (okUser && okPass) {
        window.location.href = "calendario.html";
      } else {
        msg.style.display = "block";
        inputUser.classList.add("is-invalid");
        inputPass.classList.add("is-invalid");

        // Ocultar error al volver a escribir
        const hide = () => { 
          msg.style.display = "none"; 
          inputUser.classList.remove("is-invalid");
          inputPass.classList.remove("is-invalid");
        };
        inputUser.addEventListener("input", hide, { once: true });
        inputPass.addEventListener("input", hide, { once: true });
      }
    }

    // Click y Enter para enviar
    document.getElementById("btnAcceder").addEventListener("click", validarAcceso);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") validarAcceso();
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
