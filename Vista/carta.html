<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css" />
    <title>Para mi Sofiii</title>
  </head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');

body {
  min-height: 100vh;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background-color: #ff758f;
  overflow-x: hidden;
  padding: 20px;
}

.happy-valentines {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.valentines-day-card {
  position: relative;
  width: 320px;
  height: 480px;
  background-color: #ff8fa3;
  overflow: hidden;
  border: 8px solid white;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  cursor: pointer;
}

/* Ajustes para móviles muy pequeños */
@media (max-width: 350px) {
  .valentines-day-card {
    width: 290px;
    height: 440px;
  }
}

.valentines-day-card:before {
  content: "";
  position: absolute;
  background-color: #ffb3c1;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  top: 280px;
  left: -20px;
  box-shadow: 60px 20px #ffb3c1, 130px 10px #ffb3c1, 190px 20px #ffb3c1, 260px -5px #ffb3c1;
}

.valentines-day-card:after {
  content: "";
  position: absolute;
  background-color: #ffccd5;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  top: 310px;
  left: -30px;
  box-shadow: 50px 20px #ffccd5, 120px 40px #ffccd5, 200px 15px #ffccd5, 260px 30px #ffccd5;
}

.clouds {
  position: absolute;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background-color: #fff0f3;
  z-index: 5;
  top: 360px;
  left: -20px;
  box-shadow: 55px 30px #fff0f3, 125px 10px #fff0f3, 175px 20px #fff0f3, 250px 10px #fff0f3, 310px 5px #fff0f3;
}

.hearts {
  position: absolute;
  z-index: 2;
}

.heartOne {
  position: absolute;
  left: 70px;
  top: 380px;
  animation: up 4s linear forwards 1s;
}

.heartTwo {
  position: absolute;
  left: 210px;
  top: 360px;
  animation: up 5s linear forwards 1.8s;
}

.heartThree {
  position: absolute;
  left: 120px;
  top: 420px;
  animation: up 5s linear forwards 3s;
}

.heartFour {
  position: absolute;
  left: 250px;
  top: 400px;
  animation: upTwo 7s linear infinite 3.5s;
}

.heartFive {
  position: absolute;
  left: 40px;
  top: 410px;
  animation: upTwo 8s linear infinite 4.5s;
}

.right-side:before, .right-side:after {
  position: absolute;
  content: "";
  transform-origin: left;
  animation: move 1s ease infinite;
}

.right-side:before {
  border-radius: 50% 50% 50% 0;
  width: 21px;
  height: 20px;
  background-color: #c9184a;
  left: -0.26px;
}

.right-side:after {
  height: 0;
  width: 0;
  border-bottom: 10px solid transparent;
  border-left: 15px solid #c9184a;
  top: 19px;
  left: -0.26px;
}

@keyframes move {
  0%, 100% { transform: rotateY(0); }
  50% { transform: rotateY(-45deg); }
}

.left-side:before, .left-side:after {
  position: absolute;
  content: "";
  transform-origin: right;
  animation: move 1s ease infinite;
}

.left-side:before {
  border-radius: 50% 50% 0 50%;
  width: 20px;
  height: 20px;
  left: -20.7px;
  background-color: #ff4d6d;
}

.left-side:after {
  height: 0;
  width: 0;
  left: -15px;
  border-bottom: 10px solid transparent;
  border-right: 15px solid #ff4d6d;
  top: 19px;
}

@keyframes up {
  0% { transform: translateY(0); }
  100% { transform: translateY(-250px); }
}

@keyframes upTwo {
  0% { transform: translateY(0); }
  100% { transform: translateY(-380px); }
}

.text {
  position: absolute;
  color: #800f2f;
  font-size: 30px;
  font-family: 'Pacifico', cursive;
  line-height: 1.3;
  text-align: center;
  width: 280px;
  left: 20px;
  z-index: 6;
  top: 175px; /* Altura colocada justo donde marcaba la flecha */
  transition: .3s;
}

.hover {
  color: white;
  font-family: 'Pacifico', cursive;
  text-align: center;
  margin-top: 15px;
  font-size: 15px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.2);
}

/* Clase que se activa al hacer clic */
.valentines-day-card.show .text span {
  display: none;
}

.valentines-day-card.show .text:before {
  content: "No sabes lo importante que eres para mi, has cambiado mi forma de ver la vida y le has dado sentido hasta las cosas más simples. Te amo con todo mi corazón mi amor ❤️!";
  font-size: 18px; 
  line-height: 1.4;
  display: block;
}
</style>

  <body>
    <div class="happy-valentines">
      <div class="valentines-day-card" id="card">
        <div class="clouds"></div>
        <div class="hearts">
          <div class="heartOne">
            <div class="left-side"></div>
            <div class="right-side"></div>
          </div>
          <div class="heartTwo">
            <div class="left-side"></div>
            <div class="right-side"></div>
          </div>
          <div class="heartThree">
            <div class="left-side"></div>
            <div class="right-side"></div>
          </div>
          <div class="heartFour">
            <div class="left-side"></div>
            <div class="right-side"></div>
          </div>
          <div class="heartFive">
            <div class="left-side"></div>
            <div class="right-side"></div>
          </div>
        </div>
        <div class="text"><span>Para mi Sofiii!</span></div>
      </div>
      <p class="hover">Toca la tarjeta para ver la sorpresa ❤️</p>
    </div>

    <script>
      const card = document.getElementById('card');
      card.addEventListener('click', function() {
        card.classList.toggle('show');
      });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
