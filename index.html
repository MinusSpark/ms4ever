<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nuestra Página</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="Fotos/favicon.png">
</head>

<body class="bg-light" style="padding-top: 75px; min-height: 100vh; overflow-x: hidden;">

    <!-- Navbar fija -->
    <nav class="navbar fixed-top shadow-sm" style="background-color: #d63384;">
        <div class="container-fluid justify-content-center px-2">
            <span class="fs-5 fs-md-4 navbar-brand text-white fw-bold m-0 text-center">Nuestra Página ❤️</span>
        </div>
    </nav>

    <!-- Carrusel adaptado a móvil -->
    <div class="container d-flex justify-content-center mt-3 px-3">
        <div style="max-width: 380px; width: 100%;">
            <div id="carouselExample" class="carousel slide shadow rounded overflow-hidden" data-bs-ride="carousel" data-bs-interval="2500">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="Fotos/con mi sudadera.jpeg" class="d-block w-100" alt="Con mi sudadera" style="object-fit: cover; aspect-ratio: 4/5;">
                    </div>
                    <div class="carousel-item">
                        <img src="Fotos/juntos.jpeg" class="d-block w-100" alt="Juntos" style="object-fit: cover; aspect-ratio: 4/5;">
                    </div>
                    <div class="carousel-item">
                        <img src="Fotos/fotico gafas.jpeg" class="d-block w-100" alt="Fotico gafas" style="object-fit: cover; aspect-ratio: 4/5;">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Sección de acceso en tarjeta responsiva -->
    <div class="container d-flex justify-content-center mt-4 mb-5 px-3">
        <div class="card shadow border-0 p-3 p-sm-4 text-center" style="max-width: 380px; width: 100%; border-radius: 15px;">
            <div class="card-body p-2">
                <h3 class="text-danger fs-6 fw-bold mb-3">Para poder acceder tienes que responder una pregunta 🫵🏽</h3>
                <h4 class="fs-6 fw-bold text-dark mb-3">¿Sitio donde nos conocimos?</h4>
                
                <!-- Input centrado -->
                <input type="text" id="passwordInput" class="form-control text-center mx-auto mt-2 py-2" placeholder="Responde mi amor..." onkeypress="verificarEnter(event)">
                
                <button onclick="validarAcceso()" class="btn btn-primary w-100 mt-3 py-2 fw-bold" style="background-color: #d63384; border: none; border-radius: 8px;">Acceder</button>
                
                <p id="mensajeError" class="text-danger mt-3 mb-0" style="display: none; font-size: 0.85rem;">
                    ❌ Contraseña incorrecta, ¡piensa bien mi amor!
                </p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        function validarAcceso() {
            var contraseña = document.getElementById("passwordInput").value.toLowerCase().trim();

            if (contraseña === "copernico") {
                window.location.href = "inicioPagina.html";
            } else {
                var errorMsg = document.getElementById("mensajeError");
                errorMsg.style.display = "block";
                
                var input = document.getElementById("passwordInput");
                input.classList.add("is-invalid");

                const removeError = () => {
                    errorMsg.style.display = "none";
                    input.classList.remove("is-invalid");
                };
                input.addEventListener("input", removeError, { once: true });
            }
        }

        function verificarEnter(event) {
            if (event.key === "Enter") {
                validarAcceso();
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
