<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nuestra Página</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="Fotos/favicon.png">
</head>

<body class="bg-light" style="padding-top: 80px;">

    <!-- Navbar fija -->
    <nav class="navbar fixed-top shadow-sm" style="background-color: #d63384;">
        <div class="container-fluid justify-content-center">
            <span class="fs-4 navbar-brand text-white fw-bold m-0">Nuestra Página ❤️</span>
        </div>
    </nav>

    <!-- Carrusel centrado y estilizado -->
    <div class="container d-flex justify-content-center mt-3">
        <div style="max-width: 500px; width: 100%;">
            <div id="carouselExample" class="carousel slide shadow rounded overflow-hidden" data-bs-ride="carousel" data-bs-interval="2500">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="Fotos/con mi sudadera.jpeg" class="d-block w-100" alt="Con mi sudadera">
                    </div>
                    <div class="carousel-item">
                        <img src="Fotos/juntos.jpeg" class="d-block w-100" alt="Juntos">
                    </div>
                    <div class="carousel-item">
                        <img src="Fotos/fotico gafas.jpeg" class="d-block w-100" alt="Fotico gafas">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Sección de acceso en tarjeta -->
    <div class="container d-flex justify-content-center mt-4 mb-5">
        <div class="card shadow border-0 p-4 text-center" style="max-width: 450px; width: 100%;">
            <div class="card-body">
                <h3 class="text-danger fs-5 mb-3">Para poder acceder tienes que responder una pregunta 🫵🏽</h3>
                <h4 class="fs-6 fw-bold text-dark mb-3">¿Sitio donde nos conocimos?</h4>
                
                <!-- Input con evento para detectar la tecla Enter -->
                <input type="text" id="passwordInput" class="form-control text-center mx-auto mt-2" placeholder="Responde mi amor..." onkeypress="verificarEnter(event)">
                
                <button onclick="validarAcceso()" class="btn btn-primary w-100 mt-3" style="background-color: #d63384; border: none;">Acceder</button>
                
                <p id="mensajeError" class="text-danger mt-3 mb-0" style="display: none; font-size: 0.9rem;">
                    ❌ Contraseña incorrecta, ¡piensa bien mi amor!
                </p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        function validarAcceso() {
            var contraseña = document.getElementById("passwordInput").value.toLowerCase().trim();

            if (contraseña === "copernico") {
                window.location.href = "inicioPagina.html"; // Redirige si coincide
            } else {
                var errorMsg = document.getElementById("mensajeError");
                errorMsg.style.display = "block";
                
                // Pequeña animación de error en el input
                var input = document.getElementById("passwordInput");
                input.classList.add("is-invalid");
            }
        }

        function verificarEnter(event) {
            if (event.key === "Enter") {
                validarAcceso();
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
